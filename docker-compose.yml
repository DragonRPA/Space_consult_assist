version: '3.8'

services:
  fastapi:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"  # 로컬호스트만 바인딩 (Nginx 프록시 경유)
    env_file:
      - .env
    depends_on:
      - ollama
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fastapi
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"  # 로컬호스트만 바인딩 (외부 직접 접근 차단)
    restart: unless-stopped

volumes:
  ollama_data:


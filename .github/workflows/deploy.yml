name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python syntax & compile check
        run: |
          python -m py_compile backend/app/main.py
          python -m py_compile backend/app/api/v1/endpoints/counsel.py
          python -m py_compile backend/app/api/v1/endpoints/visits.py
          python -m py_compile backend/app/api/v1/endpoints/parts.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend dependencies & lint
        run: |
          cd frontend
          npm install || echo "NPM modules check"
